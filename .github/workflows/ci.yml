name: CI/CD

# Every push and pull request is linted, tested and built. A green push to main
# goes live on https://hugobarthelmess.de: the deploy job logs in to the OTC
# server over SSH. The key there is restricted to ~/deploy/padel-counter.sh,
# which builds the new image, waits (up to 30 min) until no device is connected
# to a shared room, swaps the container and rolls back if it is not healthy.
# Docs-only changes do not trigger a run.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # tsc -b only covers src/; the server runs through tsx without a type check.
      - name: Typecheck server
        run: npx tsc -p server/tsconfig.json

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Deployments run one after another, none is cancelled. The script skips
    # commits older than the one already live.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://hugobarthelmess.de
    steps:
      - name: Deploy to the OTC server
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 -o ServerAliveInterval=30 ubuntu@164.30.69.35 "$GITHUB_SHA"

      - name: Site reachable
        run: |
          curl -fsS -o /dev/null --retry 5 --retry-delay 3 --retry-all-errors https://hugobarthelmess.de/
          curl -fsS --retry 5 --retry-delay 3 --retry-all-errors https://hugobarthelmess.de/healthz
