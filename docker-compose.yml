services:
  padel-score:
    build: .
    # Rebuild locally with: docker compose up -d --build
    image: padel-score:latest
    container_name: padel-score
    restart: unless-stopped
    # Expose the app on host port 80 (change the left side to use another port,
    # e.g. "8080:3001", if something else already listens on 80).
    ports:
      - "80:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      # Admin panel (reachable at /#admin). Leave unset to fully disable admin
      # features. Set a strong secret to enable listing rooms and sending
      # popup messages, e.g. via a .env file or your shell:
      #   ADMIN_TOKEN=change-me docker compose up -d
      - ADMIN_TOKEN=${ADMIN_TOKEN:-HalloTest}
