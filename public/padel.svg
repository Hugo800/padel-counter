<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Rounded tile in the padel-green brand gradient -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1c6b48" />
      <stop offset="1" stop-color="#0f4630" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)" />
  <!-- Padel racket head + string grid -->
  <circle cx="32" cy="24" r="13" fill="none" stroke="#fff" stroke-width="3" />
  <g stroke="#fff" stroke-width="2" stroke-linecap="round">
    <line x1="25" y1="14" x2="25" y2="34" />
    <line x1="32" y1="12" x2="32" y2="36" />
    <line x1="39" y1="14" x2="39" y2="34" />
    <line x1="20" y1="20" x2="44" y2="20" />
    <line x1="19" y1="26" x2="45" y2="26" />
  </g>
  <!-- Racket handle -->
  <rect x="29" y="36" width="6" height="18" rx="3" fill="#fff" />
  <!-- Ball accent in the light padel-court lime -->
  <circle cx="43" cy="41" r="5" fill="#c9f36b" stroke="#0f4630" stroke-width="1.5" />
</svg>
